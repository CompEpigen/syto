# ──────────────────────────────────────────────────────────────────
# Pseudo-Bulk Mixture Generation Configuration
# ──────────────────────────────────────────────────────────────────
# Usage:
#   python App/main.py --task generate_pseudobulk --config App/config/pseudobulk_cancer_detector.yaml

# ── Classifier ────────────────────────────────────────────────────
# Which classifier was used (or should be used) to predict reads
# Supported values: methylbert | dismir | cancer_detector | lookup
classifier_type: lookup

# ── Input data ────────────────────────────────────────────────────
# "raw_splits" — raw splits that still need classifier prediction
# "uxm_prepared"  — splits already prepared for uxm
# "pre_predicted"  — pre-predicted splits (already enriched with predictions)
# input_type: raw_splits
input_type: pre_predicted

# Directory containing train.parquet, valid.parquet, test.parquet
# (used when input_type == parquet)
data_path: /home/luna.kuleuven.be/u0169940/Data/Loyfer/SoftLabelsTrainingData_205files_pooled_Jaccard_hg38_mincpg_4_minlen_10_no_data_leak

# Pre-predicted pickle paths (used when input_type == pickle)
pickle_paths:
  train: /home/luna.kuleuven.be/u0169940/Repos/methyldl/Experiments/pseudobulk/LookupClassifier_SoftLabels_Ours/pseudobulk/train_predicted.pkl
  valid: /home/luna.kuleuven.be/u0169940/Repos/methyldl/Experiments/pseudobulk/LookupClassifier_SoftLabels_Ours/pseudobulk/valid_predicted.pkl
  test: /home/luna.kuleuven.be/u0169940/Repos/methyldl/Experiments/pseudobulk/LookupClassifier_SoftLabels_Ours/pseudobulk/test_predicted.pkl

# ── Classifier checkpoint ────────────────────────────────────────
# Required when input_type == parquet (classifier must run prediction)
classifier_checkpoint: /home/luna.kuleuven.be/u0169940/Repos/methyldl/Experiments/pseudobulk/LookupClassifier_SoftLabels_Ours/lookup_fitted.joblib

classifier_config:
  # foundation_model: hanyangii/methylbert_hg19_12l
  # classifier_head_implementation: dmr_attention_based
  dmr_label_column: dmr_ctype_label
  seq_length: 150
  # batch_size: 2200
  soft_labels: true 
  # Dismir-specific (only used when classifier_type == dismir)
  # dismir_flavor: lstm

# ── Labels & atlas ────────────────────────────────────────────────
labels_dict_path: App/labels_dict.json
atlas_path: /home/luna.kuleuven.be/u0169940/Repos/UXM_deconv/supplemental/Atlas.U25.l4.hg38.full.tsv
num_labels: 39

# ── Split rebalancing ─────────────────────────────────────────────
# Redistribute files across splits so every split has all
# (dmr_ctype_label, original_label) combinations
rebalance_splits: false
# manual_common_labels: [28, 35]

# ── UXM input generation ─────────────────────────────────────────
# Whether to run prepare_reads_for_uxm during read preparation (Stage 2)
generate_uxm_inputs: true
# Whether to compute sf/counts tables during IO generation (Stage 4)
generate_uxm_inputs_in_ios: false

# ── Generation mode ───────────────────────────────────────────────
# "random"              — randomly select cell types and proportions
# "target_proportions"  — use pre-defined proportion vectors
generation_mode: target_proportions

# ── Random mode parameters ────────────────────────────────────────
# Labels allowed in the random mixture (null → all labels 0..num_labels-1)
# allowed_labels: null
# Maximum number of cell types per mixture
# n_cells_max: 10

# ── Target proportions mode ──────────────────────────────────────
# Each entry is a length-num_labels proportion vector summing to 1.
# Uncomment and populate for target_proportions mode.
target_proportions_path: /home/luna.kuleuven.be/u0169940/Repos/methyldl/Experiments/pseudobulk/methylBert_Loyfer_205files_U25_attentionClassifier_hg38_dmr_ctype_label_mincpg_4_minlen_10_postfiltered_min_length_50_soft_labels_pooled/target_proportions.npz

# ── Shared generation parameters ─────────────────────────────────
n_io_examples: 100000
n_workers: 10
batch_size: 100
checkpoint_interval: 1000
start_checkpoint_idx: 0
resume_from_checkpoint: false
# Reads to sample per split per IO example (null → int(4.75e5))
n_read_per_split: 475000

# ── Output ────────────────────────────────────────────────────────
output_dir: /home/luna.kuleuven.be/u0169940/Repos/methyldl/Experiments/pseudobulk/LookupClassifier_SoftLabels_Ours//pseudobulk
