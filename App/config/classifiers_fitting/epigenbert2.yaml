# Classifier Fitting - EpigenBERT2 (DNABERT-2 based)
# ====================================================
# Run with:
#   python App/main.py --task classifier_fit --config App/config/classifiers_fitting/epigenbert2.yaml
#
# Expected data layout (datasets: all -> files directly under data_path):
#   <data_path>/train.{parquet,csv,txt}
#   <data_path>/valid.{parquet,csv,txt}   (optional, used for validation metrics)
# Required columns: seq, pattern, label, dmr_ctype_label (GRG/DMR id used by the
# grg_attention_based classifier head)
#
# Columnar layout (alternative, auto-detected): a partitioned parquet dataset
#   <data_path>/<dataset>/region_bucket=*/part-*.parquet
# with a `split` column (train/valid/test). Set `label_column:` to the training
# label column (neural archs). Optional: `data_format: auto|legacy|columnar`,
# `split_column: split`, `min_pattern_length: N` (drop reads with < N marked CpGs;
# applies to both layouts).

# Model Configuration
model:
  architecture: epigenbert2
  foundation_model: foundationalModels/DNABERT-2-117M  # local path to a cached DNABERT-2 checkpoint
  num_labels: 39
  use_cpg_methylation: true
  use_m6a_methylation: false
  classifier_head_implementation: grg_attention_based
  soft_labels: true

# Data Configuration
data_path: /home/luna.kuleuven.be/u0169940/Data/Loyfer/
max_sequence_length: 150
prediction_batch_size: 2200
datasets: SoftLabelsTrainingData_205files_pooled_Jaccard_hg38_mincpg_4_minlen_10_no_data_leak_d041

# Output Configuration
output:
  output_dir: output/classifier_fit_test/epigenbert2

# MLflow Configuration
mlflow:
  enabled: true
  experiment_name: classifier_fit_test_epigenbert2
  tracking_uri: null  # Leave as null for local tracking or specify remote URI

# Training Configuration (forwarded to EpigenDnabert2.fit_split as kwargs)
training:
  grg_label_column: dmr_ctype_label
  # Balanced training: cap background (off-target) reads per batch. When true,
  # a signal_mask is computed from the training data as
  # (original_label == dmr_ctype_label) and BalancedTrainer is used instead of
  # the default trainer. Requires both on-target and background reads present,
  # else the run fails with a ValueError.
  use_balanced_trainer: false
  # Fraction of each training batch allowed to be background reads (only used
  # when use_balanced_trainer: true).
  bg_ratio: 0.3
  # Compute train-set metrics (accuracy/f1/precision/recall/AP/MCC) via a final
  # full evaluation pass over the training data after fit. Expensive on large
  # datasets; set to false to skip.
  compute_train_metrics: true
  # Optional early stopping (transformers.EarlyStoppingCallback). Omit this
  # block or set enabled: false to disable. When enabled, load_best_model_at_end
  # and metric_for_best_model are auto-enforced if unset.
  early_stopping:
    enabled: true
    early_stopping_patience: 5
    early_stopping_threshold: 0.0
  training_args:
    run_name: dnabert2_with_dmr_head_loyfer
    per_device_train_batch_size: 512
    per_device_eval_batch_size: 3200
    gradient_accumulation_steps: 1
    learning_rate: 0.00001
    weight_decay: 0.001
    fp16: false
    save_steps: 100
    eval_strategy: steps
    eval_steps: 100
    warmup_steps: 100
    logging_steps: 100
    num_train_epochs: 1
    overwrite_output_dir: true
    log_level: info
    find_unused_parameters: false
    batch_eval_metrics: false
    eval_and_save_results: true
    remove_unused_columns: false
    eval_accumulation_steps: 8
    torch_empty_cache_steps: 10
    prediction_loss_only: false
    gradient_checkpointing: false
    skip_memory_metrics: true
    auto_find_batch_size: false
    max_grad_norm: 1.0
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_epsilon: 0.000001
