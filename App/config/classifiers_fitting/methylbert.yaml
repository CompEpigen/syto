# Classifier Fitting - MethylBERT
# =================================
# Run with:
#   python App/main.py --task classifier_fit --config App/config/classifiers_fitting/methylbert.yaml
#
# Expected data layout (datasets: all -> files directly under data_path):
#   <data_path>/train.{parquet,csv,txt}
#   <data_path>/valid.{parquet,csv,txt}   (optional, used for validation metrics)
# Required columns: seq, pattern, label, dmr_ctype_label (GRG/DMR id)
#
# Columnar layout (alternative, auto-detected): a partitioned parquet dataset
#   <data_path>/<dataset>/region_bucket=*/part-*.parquet
# with a `split` column (train/valid/test). Set `label_column:` to the training
# label column (neural archs). Optional: `data_format: auto|legacy|columnar`,
# `split_column: split`, `min_pattern_length: N` (drop reads with < N marked CpGs;
# applies to both layouts).

# Model Configuration
model:
  architecture: methylbert
  foundation_model: foundationalModels/methylbert_hg19_12l  # local path to a cached MethylBERT checkpoint
  num_labels: 39
  num_grg_labels: 39
  classifier_head_implementation: grg_attention_based
  soft_labels: true

# Data Configuration
data_path: /mnt/data/loyfer/parsed_dataset/U25.l4.hg38/
max_sequence_length: 160
prediction_batch_size: 128
datasets: labelers_on_train_no_pattern_len_filter/final
label_column: soft_label_pooled
min_pattern_length: 4

# Output Configuration
output_dir: tmp/classifier_fit_test/methylbert

# MLflow Configuration
mlflow:
  enabled: true
  experiment_name: pseudobulk
  tracking_uri: file:///mnt/data/syto_experiments/mlflow # Leave as null for local tracking or specify remote URI

# Training Configuration (forwarded to MethylBert.fit_split as kwargs)
training:
  grg_label_column: dmr_ctype_label
  # Balanced training: cap background (off-target) reads per batch. When true,
  # a signal_mask is computed from the training data as
  # (original_label == dmr_ctype_label) and BalancedTrainer is used instead of
  # the default trainer. Requires both on-target and background reads present,
  # else the run fails with a ValueError.
  use_balanced_trainer: false
  # Fraction of each training batch allowed to be background reads (only used
  # when use_balanced_trainer: true).
  bg_ratio: 0.3
  # Compute train-set metrics (accuracy/f1/precision/recall/AP/MCC) via a final
  # full evaluation pass over the training data after fit. Expensive on large
  # datasets; set to false to skip.
  compute_train_metrics: true
  # Optional early stopping (transformers.EarlyStoppingCallback). Omit this
  # block or set enabled: false to disable. When enabled, load_best_model_at_end
  # and metric_for_best_model are auto-enforced if unset.
  early_stopping:
    enabled: true
    early_stopping_patience: 5
    early_stopping_threshold: 0.002
  training_args:
    learning_rate: 0.0004
    weight_decay: 0.1
    warmup_steps: 100
    adam_epsilon: 0.000001
    logging_steps: 200
    eval_steps: 200
    save_steps: 200
    per_device_train_batch_size: 512
    per_device_eval_batch_size: 2200
    num_train_epochs: 5
    eval_strategy: steps
    fp16: true
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
    adam_beta1: 0.9
    adam_beta2: 0.98
    seed: 950410
    save_total_limit: 1
    metric_for_best_model: "eval_loss"