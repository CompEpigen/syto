phase: finalize                       # stage | finalize | all
input_dir: /mnt/data/loyfer/recovered_reads/U250.l4.hg19
output_dir: /mnt/data/loyfer/parsed_dataset/U250.l4.hg19
atlas_path: ../UXM_deconv/supplemental/Atlas.U250.l4.hg19.full.tsv
reference_genome: hg19
labels_dict_path: App/labels_dict.json
n_buckets: 128
n_workers: 8                     # RAM-bound on the 64 GB workstation; 1/file on SLURM
sep: "\t"
train_ratio: 0.7
valid_ratio: 0.15
test_ratio: 0.15
seed: 42
cell_type_match_dict:
  Ovary-Ep: Ovary+Endom-Ep       # atlas target name -> labels_dict name

signature:
  start_column: read_start
  methylation_pattern_column: methylation_ids

labelers:                        # key = destination column for the produced label
  soft_label_pooled:
    type: data_driven_soft
    distance_name: jaccard
    perform_pooling: true
    max_distance: 0.41
    min_reads: 30
  soft_label_no_pooling:
    type: data_driven_soft
    distance_name: jaccard
    perform_pooling: true
    max_distance: 0.00
    min_reads: 1
  soft_label_superset_pooled:
    type: data_driven_soft
    distance_name: jaccard
    perform_pooling: true
    max_distance: 0.41
    min_reads: 30
    add_superset_counts: true
  soft_label_superset_no_pooling:
    type: data_driven_soft
    distance_name: jaccard
    perform_pooling: true
    max_distance: 0.00
    min_reads: 1
    add_superset_counts: true
  hard_label_with_background:
    type: hard_with_background
  soft_label_archetype_uniform_prior:
    type: archetype
    ctype_prior_type: uniform

  
  
