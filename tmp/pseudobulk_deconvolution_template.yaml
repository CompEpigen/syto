# ══════════════════════════════════════════════════════════════════════════════
# Pseudobulk Deconvolution Pipeline Configuration Template
# ══════════════════════════════════════════════════════════════════════════════
#
# Drives PseudobulkDeconvolutionPipeline (App/pseudobulk_deconvolution_pipeline.py),
# which runs one or more baseline deconvolution models over all pseudobulks in a
# pre-generated HDF5 file and writes predicted proportions as parquet files.
#
# All models under ``baselines`` run in a single pass: reads are sampled once
# per pseudobulk and shared across every model.
#
# Output layout:
#   {output_dir}/{output_key}/{split}_deconvolution_results.parquet
#
# Each parquet has one row per (pseudobulk × cell type):
#   pb_index          – pseudobulk position within the split
#   cell_type         – cell type name from labels_dict
#   target_proportion – ground-truth mixing proportion
#   {output_key}      – predicted proportion (column named after output_key)
#
# For EM models with em_checkpoints, one parquet is written per checkpoint:
#   {output_dir}/celfieish_50_steps/{split}_deconvolution_results.parquet
#
# Usage:
#   python App/main.py --task deconvolute_pseudobulk --config App/config/deconvolution/pseudobulk_deconvolution_template.yaml

# ══════════════════════════════════════════════════════════════════════════════
# INPUT DATA
# ══════════════════════════════════════════════════════════════════════════════

# Consolidated pseudobulk HDF5 file produced by the pseudobulk v2 pipeline.
pseudobulk_h5_path: /home/luna.kuleuven.be/u0169940/Repos/syto/tmp/pseudobulk_generation/pseudobulk.h5

# Splits to process. If omitted, all splits present in the HDF5 file are used.
# splits: [train, valid, test]

# Column in the read subsets that holds the class/cell-type label.
# Defaults to "original_label" if omitted.
# class_label_column: original_label

# ══════════════════════════════════════════════════════════════════════════════
# LABELS
# ══════════════════════════════════════════════════════════════════════════════

# JSON file mapping integer label id → cell type name (e.g. App/labels_dict.json).
labels_dict_path: App/labels_dict.json

# ══════════════════════════════════════════════════════════════════════════════
# BASELINE MODELS
# ══════════════════════════════════════════════════════════════════════════════
#
# List one or more baseline models to run.  Each entry requires at minimum:
#   model      – one of: uxm | celfieish | celfie
#   atlas_path – path to the reference atlas for this model
#
# UXM uses a region-level TSV atlas (Atlas.U25.l4.hg38.full.tsv).
# CelFiE-ISH and CelFiE share the CpGBetaCountsMethylationAtlas format
# (per-CpG TSV with {CellType}_METH / {CellType}_COV columns).  They can
# point to the same atlas file or different ones.
#
# EM models (celfieish, celfie) support two operating modes:
#
#   em_checkpoints: null (or omitted)
#     → EM runs until convergence (up to num_iterations steps).
#       One parquet is written, column named "celfieish" / "celfie".
#
#   em_checkpoints: [10, 50, 100, 200]
#     → EM runs for exactly max(em_checkpoints) steps without early stopping.
#       One parquet per checkpoint, columns named
#       "celfieish_10_steps", "celfieish_50_steps", etc.
#       num_iterations is ignored in this mode.

baselines:

  # --------------------------------------------------------------------------
  # UXM
  # --------------------------------------------------------------------------
  - model: uxm
    atlas_path: /home/luna.kuleuven.be/u0169940/Repos/UXM_deconv/supplemental/Atlas.U25.l4.hg38.full.tsv
    # Cell types in the atlas to exclude from deconvolution.
    ignore_cells: ["Megakaryocytes"]

  # --------------------------------------------------------------------------
  # CelFiE-ISH  (read-level EM)
  # --------------------------------------------------------------------------
  - model: celfieish
    atlas_path: /home/luna.kuleuven.be/u0169940/Repos/syto/baselines/deconvolution/celfieish/UXMU25_hg38_l1.txt
    # atlas_name: celfieish_atlas       # optional; defaults to basename of atlas_path
    reference_genome: hg38            # optional; default hg38

    # EM checkpoint mode: proportions recorded at each listed iteration.
    # Remove or set to null to run until convergence instead.
    # em_checkpoints: [10, 50]

    # Used only when em_checkpoints is null:
    num_iterations: 50
    convergence_criteria: 0.001

  # --------------------------------------------------------------------------
  # CelFiE  (aggregated-counts EM)
  # --------------------------------------------------------------------------
  - model: celfie
    atlas_path: /home/luna.kuleuven.be/u0169940/Repos/syto/baselines/deconvolution/celfieish/UXMU25_hg38_l1.txt
    # atlas_name: celfie_atlas
    reference_genome: hg38

    # em_checkpoints: [10, 50]

    # Used only when em_checkpoints is null:
    num_iterations: 50
    convergence_criteria: 0.001
    # random_restarts: 1    # ignored when em_checkpoints is set

# ══════════════════════════════════════════════════════════════════════════════
# PARALLELIZATION
# ══════════════════════════════════════════════════════════════════════════════

# Number of worker processes (fork). Set to 1 for sequential / debug mode.
# All models share the same pool — reads are sampled once per pseudobulk and
# passed to every model, so RAM scales sub-linearly with n_workers.
n_workers: 15

# IPC chunksize: tasks sent to each worker per round-trip.
# For slow tasks (>100 ms each) 1 is fine.
batch_size: 1

# ══════════════════════════════════════════════════════════════════════════════
# OUTPUT
# ══════════════════════════════════════════════════════════════════════════════

# Root directory for results. Subdirectories are created automatically:
#   {output_dir}/uxm/{split}_deconvolution_results.parquet
#   {output_dir}/celfieish_50_steps/{split}_deconvolution_results.parquet
output_dir: /home/luna.kuleuven.be/u0169940/Repos/syto/tmp/
