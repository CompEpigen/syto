[tool.poetry]
name = "methyldl"
version = "0.2.0"
description = ""
authors = ["Dmytro Rizdvanteskyi"]
readme = "README.md"
packages = [{include = "methyldl"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "2.0.2"
transformers = "^4.46.0"
torch = {version = "^2.5.0+cu121", source = "torch121"}
scikit-learn = "^1.5.2"
einops = "^0.8.0"
torchvision = "^0.20.1"
accelerate = ">=0.26.0"
pandas = "^2.2.3"
matplotlib = "^3.10.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[[tool.poetry.source]]
name = "torch121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
