[tool.poetry]
name = "syto"
version = "0.5.0"
description = ""
authors = ["Dmytro Rizdvanetskyi", "Nathan Roos"]
readme = "README.md"
packages = [{include = "syto"}, {include = "baselines"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "2.1.0"
transformers = "4.52.4"
torch = {version = "^2.7.0+cu128", source = "torch128"}
scikit-learn = "^1.5.2"
einops = "^0.8.0"
torchvision = "^0.22"
accelerate = ">=0.26.0"
pandas = "^2.2.3"
matplotlib = "^3.10.0"
pyarrow = "19.0.1"
mlflow = "^2.22.1"
seaborn = "^0.13.2"
gputil = "^1.4.0"
xgboost = "^3.1.3"
umap-learn = "^0.5.11"
pysam = "^0.23.3"
cloudpickle = "^3.1.2"
cvxpy = "^1.8.2"
jax = {extras = ["cuda12-local"], version = "^0.9.2"}
dask = "^2026.3.0"
h5py = "^3.16.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
coverage = "^7.10.7"
parameterized = "^0.9.0"
genbadge ="^1.1.0"
defusedxml ="^0.7.0"
pytest = "^9.0.3"
pylint = "^4.0.5"

[tool.poetry.extras]
eda = ["intervaltree", "plotly"]

[[tool.poetry.source]]
name = "torch128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source_pkgs = ["syto"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/tmp/*",
    "/tmp/*",
    "*/_remote_module_non_scriptable.py",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
]
disable_warnings = ["no-data-collected", "module-not-measured"]
command_line = "-m unittest discover -v"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
skip_empty = false
ignore_errors = true  # This helps with the temp file issue
skip_covered = false  # Also show fully covered files
show_missing = false  # Show which lines are missing

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true