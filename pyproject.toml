[tool.poetry]
name = "methyldl"
version = "0.4.0"
description = ""
authors = ["Dmytro Rizdvanteskyi"]
readme = "README.md"
packages = [{include = "methyldl"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "2.0.2"
transformers = "4.52.4"
torch = {version = "^2.7.0+cu128", source = "torch128"}
scikit-learn = "^1.5.2"
einops = "^0.8.0"
torchvision = "^0.22"
accelerate = ">=0.26.0"
pandas = "^2.2.3"
matplotlib = "^3.10.0"
pyarrow = "19.0.1"
mlflow = "^2.22.1"
seaborn = "^0.13.2"
gputil = "^1.4.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[[tool.poetry.source]]
name = "torch128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
